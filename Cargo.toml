[package]
name = "egui_spellcheck"
# Version scheme: the major/minor track the supported `egui` release (0.36.x targets egui 0.36), trying to maintain
# parity with the version used in latest egui_extras / egui_dock while the patch component is bumped for this crate's
# own fixes and features within that egui line.
version = "0.36.2"
edition = "2024"
rust-version = "1.95"
authors = ["Shawn Tocidlowski"]
description = "Embedded spell-checking and optional grammar hints for egui text editors"
readme = "README.md"
repository = "https://github.com/STocidlowski/egui_spellcheck"
license = "MPL-2.0"
keywords = ["spelling", "spellcheck", "grammar", "egui"]
categories = ["text-processing", "text-editors", "gui"]
# The bundled dictionary data under src/spell_check/dictionaries is licensed
# separately from this crate's MPL-2.0 code; see THIRD_PARTY_NOTICES.md.
# Keep the published .crate lean: ship only what's needed to build and use the
# library. The Python dictionary generator, IDE config, CI config, build
# artifacts, and any privately built (licensed) dictionaries stay in the git
# repository but are excluded from the package.
exclude = [
    "target/",
    ".github/",
    ".idea/",
    "licensed/",
    "src/medical_dictionary_generator/",
    "**/__pycache__/",
]

[package.metadata.docs.rs]
# Build docs.rs with every feature so grammar/medical items are documented.
all-features = true


[features]
# Grammar checking via the `harper-core` crate. Enabled by default; opt out with
# `--no-default-features` (the crate is heavy, so disabling it lightens builds
# that don't need grammar checks).
default = ["grammar"]
grammar = ["dep:harper-core"]
medical-en = []


# Optimize all profiles at opt-level 2. The spell/grammar check is heavily
# dependency-bound (harper-core's FST work and spellbook lookups), and an
# unoptimized `dev` build runs that code several-fold slower
# ~10 s (dev) vs. ~2 s (release) highlighting delay. Building `dev` at opt-level 2
# closes most of that gap at the cost of somewhat slower compile.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 2

[dependencies]
spellbook = "0.4.2"
serde = { version = "1.0.228", features = ["derive"] }
egui = "0.36.2"
log = "0.4.33"
harper-core = { version = "2.5.0", optional = true }

[dev-dependencies]
# `default-features = false` drops eframe's default Linux windowing backends, so
# `winit` would have no platform backend on Linux and fail with
# "The platform you're compiling for is not supported by winit" (CI ubuntu-latest,
# which builds the `spellcheck_demo` example). Re-enable both Linux backends
# explicitly; they are no-ops on Windows/macOS.
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "x11", "wayland"] }
